# Check the entire workspace, including shared game code and the multiplayer server.
# Keep hooks read-only; run pnpm format to apply formatting before staging changes.
pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm format:check
    lint:
      run: pnpm lint
    types:
      run: pnpm typecheck
pre-push:
  commands:
    tests:
      run: pnpm test
